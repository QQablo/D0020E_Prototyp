<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code - Car Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      color: #fff;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    #qr-code {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Scan to Play the Car Game!</h1>
  <p>Scan this QR code on your mobile device to access the game.</p>
  <div id="qr-code"></div>

  <!-- Include the QRCode.js library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    // URL of the main game page (replace this with your actual URL)
    const gameUrl = "http://localhost:5500/index.html";  // Localhost for testing, replace with your actual URL if needed

    // Generate the QR code that links to the game URL
    const qrCodeContainer = document.getElementById('qr-code');
    QRCode.toCanvas(qrCodeContainer, gameUrl, {
      width: 200, // Size of the QR code
      margin: 2,  // Margin around the QR code
      color: {
        dark: "#000000", // QR code color
        light: "#ffffff" // Background color
      }
    }, function (error) {
      // Error handling for QR code generation
      if (error) {
        console.error("QR Code generation error:", error); // This will log any errors
      } else {
        console.log("QR code generated successfully!"); // This will log success message
      }
    });  // <-- Closing the QRCode function call here
  </script>
</body>
</html>
