<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code - LTU-kart Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4fb4eec1, #55bcf7);
      color: #fff;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    #qr-code {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Scan to Play the LTU-kart Game!</h1>
  <p>Scan this QR code on your mobile device to access the game.</p>
  <canvas id="qr-code"></canvas> <!-- Changed div to canvas -->

  <!-- Include the QRCode.js library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    // URL of the main game page (replace this with your actual URL)
    const gameUrl = "http://127.0.0.1:5500/test_folder/index.html";  // Replace with your actual game URL

    // Select the canvas element for the QR code
    const qrCodeCanvas = document.getElementById('qr-code');

    // Generate the QR code that links to the game URL
    QRCode.toCanvas(qrCodeCanvas, gameUrl, {
      width: 200, // Size of the QR code
      margin: 2,  // Margin around the QR code
      color: {
        dark: "#000000", // QR code color
        light: "#ffffff" // Background color
      }
    }, function (error) {
      if (error) {
        console.error("QR Code generation error:", error); // Logs the error
      } else {
        console.log("QR code generated successfully!"); // Logs success
      }
    });
  </script>
</body>
</html>
