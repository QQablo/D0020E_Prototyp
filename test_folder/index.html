<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTU-kart Game - Start</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }

        label {
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            box-sizing: border-box;
            text-align: center;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            input[type="text"], button {
                font-size: 1rem;
                padding: 10px;
            }

            button {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Welcome to the LTU-kart Game</h1>
    <form action="" method="get">
        <label for="name">Enter your name to start playing:</label>
        <input type="text" id="name" name="name" placeholder="Your name..." required>
        <button type="submit">Start Game</button>
    </form>
    <footer>
        &copy; 2025 LTU. All rights reserved.
    </footer>
</body>
</html>
